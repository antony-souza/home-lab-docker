name: proxy-example

services:
  whoami:
    image: traefik/whoami:v1.11.0
    restart: unless-stopped
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-proxy
      traefik.http.routers.proxy-example.rule: "Host(`traefik.localhost`)"
      traefik.http.routers.proxy-example.entrypoints: web
      traefik.http.routers.proxy-example.service: proxy-example
      traefik.http.services.proxy-example.loadbalancer.server.port: "80"

networks:
  proxy:
    name: traefik-proxy
    external: true
