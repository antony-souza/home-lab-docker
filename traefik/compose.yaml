name: server-proxy

services:
  traefik:
    image: traefik:v3.6.22
    container_name: server-traefik
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TRAEFIK_PORT:-8090}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    name: traefik-proxy
    driver: bridge
